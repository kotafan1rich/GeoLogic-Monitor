database:
  postgresql:
    ssl_mode: disable
    min_conns: 5
    max_conns: 25
    max_conn_idle_lifetime: 5m
    max_conn_lifetime: 15m

producer:
  kafka:
    topic: notifications
    flush_timeout: 15000ms
    attempt_timeout: 5s
    max_retries: 3
    batch_size: 65536
    buffer_max_msg: 1000
    buffer_max_bytes: 10485760

monitoring:
  opened_window: 2160h
  checkpoint_bootstrap: 2160h
  competitor_ttl: 24h
  fetch_concurrency: 2
  route_concurrency: 4