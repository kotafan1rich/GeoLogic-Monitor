aggregator:
  digitalspb:
    http:
      max_idle_conns: 4
      max_idle_conns_per_host: 2
      max_conns_per_host: 2
      request_timeout: 60s
      attempt_timeout: 15s
      max_retries: 3
      rate_limit:
        rps: 5
        burst: 5
    base_urls:
      spb_classif_gate: "https://spb-classif.gate.petersburg.ru/api/v2/"
      egs_gate: "https://egs.gate.petersburg.ru/egs/"
      yazzh_gate: "https://yazzh.gate.petersburg.ru"
    static_files:
      subway: "static/subway.json"
  maps:
    http:
      max_idle_conns: 1
      max_idle_conns_per_host: 1
      max_conns_per_host: 1
      request_timeout: 120s
      attempt_timeout: 30s
      max_retries: 3
      rate_limit:
        rps: 0
        burst: 0
    base_url: "https://maps.mail.ru/osm/tools/overpass/api/"
  twogis:
    http:
      max_idle_conns: 2
      max_idle_conns_per_host: 2
      max_conns_per_host: 2
      request_timeout: 30s
      attempt_timeout: 10s
      max_retries: 3
      rate_limit:
        rps: 1
        burst: 1
    base_url: "https://catalog.api.2gis.com/"

geo-api:
  write:
    max_idle_conns: 20
    max_idle_conns_per_host: 20
    max_conns_per_host: 20
    request_timeout: 60s
    attempt_timeout: 10s
    max_retries: 3
    rate_limit:
      rps: 0
      burst: 0
  write_concurrency: 8
  geocoding:
    max_idle_conns: 2
    max_idle_conns_per_host: 1
    max_conns_per_host: 1
    request_timeout: 30s
    attempt_timeout: 10s
    max_retries: 3
    rate_limit:
      rps: 3
      burst: 1
  infra_types:
