    - { slug: railway_station,   name: "Вокзал",               weight: 7,  max_radius: 1000, osm: [station] }
    - { slug: hotel,             name: "Гостиница",            weight: 4,  max_radius: 500,  osm: [hotel, hostel] }
    - { slug: museum,            name: "Музей",                weight: 4,  max_radius: 600,  osm: [museum] }
    - { slug: theatre,           name: "Театр",                weight: 3,  max_radius: 500,  osm: [theatre] }
    - { slug: cinema,            name: "Кинотеатр",            weight: 3,  max_radius: 500,  osm: [cinema] }
