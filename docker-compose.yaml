services:
  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-http://localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - geo_logic_net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      miniapp:
        condition: service_started
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - api/.env
    ports:
      - "8080:8080"
    networks:
      - geo_logic_net
    depends_on:
      api-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$${API_PORT:-8080}/health"' ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ingestion:
    build: ./ingestion
    env_file:
      - ingestion/.env
    networks:
      - geo_logic_net
    depends_on:
      api:
        condition: service_healthy
      ingestion-db:
        condition: service_healthy
      # kafka:
      #   condition: service_healthy

  bot:
    build: ./bot
    env_file:
      - bot/.env
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8082:8082"
    networks:
      - geo_logic_net
    depends_on:
      - api

  api-db:
    image: postgis/postgis:18-3.6
    env_file:
      - api/.env
    ports:
      - "5432:5432"
    networks:
      - geo_logic_net
    volumes:
      - api_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]

  ingestion-db:
    image: postgis/postgis:18-3.6
    env_file:
      - ingestion/.env
    ports:
      - "5433:5432"
    networks:
      - geo_logic_net
    volumes:
      - ingestion_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    networks:
      - geo_logic_net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-3600000}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  osrm:
    build: ./osrm
    volumes:
      - osrm_graph:/data
    ports:
      - "${OSRM_HTTP_PORT:-5000}:5000"
    networks:
      - geo_logic_net
    restart: unless-stopped

  miniapp:
    build: ./miniapp
    ports:
      - "8083:80"
    networks:
      - geo_logic_net

volumes:
  api_db_data:
  ingestion_db_data:
  kafka-data:
  osrm_graph:
  caddy_data:
  caddy_config:

networks:
  geo_logic_net:
    driver: bridge
