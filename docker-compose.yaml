services:
  api:
    build: ./api
    env_file:
      - api/.env
    ports:
      - "8080:8080"
    networks:
      - geo_logic_net
    depends_on:
      api-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$${API_PORT:-8080}/health"' ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ingestion:
    build: ./ingestion
    env_file:
      - ingestion/.env
    networks:
      - geo_logic_net
    depends_on:
      api:
        condition: service_healthy
      ingestion-db:
        condition: service_healthy
      # kafka:
      #   condition: service_healthy

  bot:
    build: ./bot
    env_file:
      - bot/.env
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8082:8082"
    networks:
      - geo_logic_net
    depends_on:
      - api

  api-db:
    image: postgis/postgis:18-3.6
    env_file:
      - api/.env
    ports:
      - "5432:5432"
    networks:
      - geo_logic_net
    volumes:
      - api_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]

  ingestion-db:
    image: postgis/postgis:18-3.6
    env_file:
      - ingestion/.env
    ports:
      - "5433:5432"
    networks:
      - geo_logic_net
    volumes:
      - ingestion_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
  # я ещё не рабтал с кафкой, потом надо будет посмотреть
  # kafka:
  #   image: apache/kafka:4.3.1
  #   container_name: kafka
  #   ports:
  #     - "9092:9092"
  #   # environment:
  #     # заполнить при подключении

  #   volumes:
  #     - kafka-data:/var/lib/kafka/data

  osrm:
    build: ./osrm
    volumes:
      - osrm_graph:/data
    ports:
      - "${OSRM_HTTP_PORT:-5000}:5000"
    networks:
      - geo_logic_net
    restart: unless-stopped

  miniapp:
    build: ./miniapp
    ports:
      - "8083:80"
    networks:
      - geo_logic_net

volumes:
  api_db_data:
  ingestion_db_data:
  osrm_graph:
    # kafka-data:

networks:
  geo_logic_net:
    driver: bridge
