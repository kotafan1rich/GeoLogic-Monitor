services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - geo_logic_net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      miniapp:
        condition: service_started
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - api/.env
    ports:
      - "8080:8080"
    networks:
      - geo_logic_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$${API_PORT:-8080}/health"' ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ingestion:
    build: ./ingestion
    env_file:
      - ingestion/.env
    networks:
      - geo_logic_net
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bot:
    build: ./bot
    env_file:
      - bot/.env
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "8082:8082"
    networks:
      - geo_logic_net
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      API_POSTGRES_PASSWORD: ${API_POSTGRES_PASSWORD}
      INGESTION_POSTGRES_PASSWORD: ${INGESTION_POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 320M
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - geo_logic_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    networks:
      - geo_logic_net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-3600000}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "nc -z -w 2 127.0.0.1 19092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - geo_logic_net
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  osrm:
    build: ./osrm
    ports:
      - "${OSRM_HTTP_PORT:-5000}:5000"
    networks:
      - geo_logic_net
    restart: unless-stopped

  miniapp:
    build: ./miniapp
    ports:
      - "8083:80"
    networks:
      - geo_logic_net

volumes:
  db_data:
  kafka-data:
  caddy_data:
  caddy_config:

networks:
  geo_logic_net:
    driver: bridge
