version: "2"

run:
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: internal/app/app\.go$
        text: 'Error return value of `db\.Close` is not checked'
        linters:
          - errcheck
      - path: internal/integrations/geocoder/client\.go$
        text: 'Error return value of `response\.Body\.Close` is not checked'
        linters:
          - errcheck
      - path: internal/integrations/osrm/client\.go$
        text: 'Error return value of `resp\.Body\.Close` is not checked'
        linters:
          - errcheck
      - path: internal/scheduler/rating_test\.go$
        text: 'Error return value of `r\.Shutdown` is not checked'
        linters:
          - errcheck
      - path: internal/service/calculate/features_test\.go$
        text: 'QF1005:'
        linters:
          - staticcheck

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
  exclusions:
    paths:
      - internal/config/logging\.go$
      - internal/domain/business_type\.go$
      - internal/integrations/osrm/client\.go$
