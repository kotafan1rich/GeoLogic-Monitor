name: Deploy production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  DOCKERHUB_OWNER: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            image: geologic-monitor-api

          - service: ingestion
            context: ./ingestion
            image: geologic-monitor-ingestion

          - service: bot
            context: ./bot
            image: geologic-monitor-bot

          - service: miniapp
            context: ./miniapp
            image: geologic-monitor-miniapp

          - service: osrm
            context: ./osrm
            image: geologic-monitor-osrm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - build

    # Здесь можно настроить ручное подтверждение деплоя.
    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/production
          chmod 600 ~/.ssh/production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production Compose file
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_PATH: ${{ vars.PROD_PATH }}
        run: |
          ssh \
            -i ~/.ssh/production \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "mkdir -p '$PROD_PATH'"

          scp \
            -i ~/.ssh/production \
            -P "$PROD_PORT" \
            deploy/docker-compose.prod.yaml \
            deploy/Caddyfile \
            "$PROD_USER@$PROD_HOST:$PROD_PATH/"

      - name: Log in to Docker Hub on production server
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_USER: ${{ vars.PROD_USER }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.PROD_DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            ssh \
              -i ~/.ssh/production \
              -p "$PROD_PORT" \
              "$PROD_USER@$PROD_HOST" \
              "docker login docker.io --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy containers
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_PATH: ${{ vars.PROD_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/production \
            -p "$PROD_PORT" \
            "$PROD_USER@$PROD_HOST" \
            "PROD_PATH='$PROD_PATH' DOCKERHUB_OWNER='$DOCKERHUB_OWNER' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
              set -euo pipefail

              cd "$PROD_PATH"

              printf 'DOCKERHUB_OWNER=%s\nIMAGE_TAG=%s\n' \
                "$DOCKERHUB_OWNER" "$IMAGE_TAG" > deploy.env

              docker compose \
                --env-file deploy.env \
                -f docker-compose.prod.yaml \
                pull

              docker compose \
                --env-file deploy.env \
                -f docker-compose.prod.yaml \
                up -d --remove-orphans --wait --wait-timeout 180

              docker compose \
                --env-file deploy.env \
                -f docker-compose.prod.yaml \
                ps
          REMOTE
