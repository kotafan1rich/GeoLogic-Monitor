name: geologic-monitor

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    env_file:
      - ./env/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - miniapp
      - bot
    networks:
      - backend

  api:
    image: ${DOCKERHUB_OWNER}/geologic-monitor-api:${IMAGE_TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    env_file:
      - ./env/api.env
    depends_on:
      api-db:
        condition: service_healthy
      osrm:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion:
    image: ${DOCKERHUB_OWNER}/geologic-monitor-ingestion:${IMAGE_TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 96M
    env_file:
      - ./env/ingestion.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  bot:
    image: ${DOCKERHUB_OWNER}/geologic-monitor-bot:${IMAGE_TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
    env_file:
      - ./env/bot.env
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - backend

  api-db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 320M
    env_file:
      - ./env/api-db.env
    volumes:
      - api_db_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-3600000}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  osrm:
    image: ${DOCKERHUB_OWNER}/geologic-monitor-osrm:${IMAGE_TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 600M
    volumes:
      - osrm_graph:/data
    networks:
      - backend

  miniapp:
    image: ${DOCKERHUB_OWNER}/geologic-monitor-miniapp:${IMAGE_TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - backend

volumes:
  api_db_data:
  kafka_data:
  osrm_graph:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
